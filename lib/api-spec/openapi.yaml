openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: forecast
    description: Revenue forecasting operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /forecast:
    post:
      operationId: runForecast
      tags: [forecast]
      summary: Run the NKE quarterly revenue forecast
      description: Retrieves SEC revenue facts and public historical prices, then evaluates expanding-window revenue models.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastInput"
      responses:
        "200":
          description: Revenue forecast results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResult"
        "502":
          description: Upstream financial data provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ForecastInput:
      type: object
      properties:
        symbol:
          type: string
          default: NKE
      required: []
    ModelMetric:
      type: object
      properties:
        mae:
          type: number
        rmse:
          type: number
        mape:
          type: number
        sampleSize:
          type: number
      required: [mae, rmse, mape, sampleSize]
    ForecastObservation:
      type: object
      properties:
        fiscalQuarter:
          type: string
        predictedRevenue:
          type: number
        actualRevenue:
          type: number
        forecastErrorPct:
          type: number
      required: [fiscalQuarter, predictedRevenue, actualRevenue, forecastErrorPct]
    StockPriceForecast:
      type: object
      properties:
        horizon:
          type: string
          enum: [1 Month, 3 Months, 6 Months]
        forecastDate:
          type: string
          format: date
        currentPrice:
          type: number
        predictedPrice:
          type: number
        expectedReturnPct:
          type: number
      required: [horizon, forecastDate, currentPrice, predictedPrice, expectedReturnPct]
    StockPricePoint:
      type: object
      properties:
        date:
          type: string
          format: date
        price:
          type: number
        kind:
          type: string
          enum: [HISTORICAL, CURRENT, FORECAST]
        label:
          type: string
      required: [date, price, kind, label]
    ForecastResult:
      type: object
      properties:
        symbol:
          type: string
        currentSharePrice:
          type: number
        currentPriceDate:
          type: string
          format: date
        nextFiscalQuarter:
          type: string
        nextRevenueForecast:
          type: number
        previousQuarterRevenue:
          type: number
        expectedRevenueGrowthPct:
          type: number
        modelUsed:
          type: string
          enum: [Baseline, Machine Learning]
        historicalMapePct:
          type: number
        baselineMetrics:
          $ref: "#/components/schemas/ModelMetric"
        machineLearningMetrics:
          $ref: "#/components/schemas/ModelMetric"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ForecastObservation"
        dataAsOf:
          type: string
          format: date
        dataSource:
          type: string
        sourceNotes:
          type: array
          items:
            type: string
        stockPriceModel:
          type: string
        stockPriceForecasts:
          type: array
          items:
            $ref: "#/components/schemas/StockPriceForecast"
        stockPriceSeries:
          type: array
          items:
            $ref: "#/components/schemas/StockPricePoint"
        historicalDirectionalAccuracyPct:
          type: number
      required:
        - symbol
        - currentSharePrice
        - currentPriceDate
        - nextFiscalQuarter
        - nextRevenueForecast
        - previousQuarterRevenue
        - expectedRevenueGrowthPct
        - modelUsed
        - historicalMapePct
        - baselineMetrics
        - machineLearningMetrics
        - observations
        - dataAsOf
        - dataSource
        - sourceNotes
        - stockPriceModel
        - stockPriceForecasts
        - stockPriceSeries
        - historicalDirectionalAccuracyPct
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]